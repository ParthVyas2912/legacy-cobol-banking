      - action: Score the transaction risk
        details: Apply fraud scoring algorithms
        paragraphs:
          - 2000-SCORE-RISK
      - action: Freeze the account if risk is determined high
        details: Insert fraud flag into the database
        paragraphs:
          - 3000-FREEZE-ACCOUNT
