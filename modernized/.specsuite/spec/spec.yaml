        description: Embedded SQL with no SQLCODE / SQLSTATE inspection after the call and no WHENEVER directive in effect.
          Unhandled SQL errors are a common source of silent data corruption in COBOL.
        currentCode: EXEC SQL ... END-EXEC.
        suggestedReplacement: |-
          EXEC SQL ... END-EXEC.
              IF SQLCODE NOT = ZERO
                  PERFORM HANDLE-SQL-ERROR
              END-IF.
        tags:
          - sql
          - error-handling
