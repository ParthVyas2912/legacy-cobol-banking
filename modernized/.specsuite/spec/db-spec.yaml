queryPatterns:
  - name: ACCTMGR:INSERT:acct_audit
    frequency: medium
    query: |-
      INSERT INTO ACCT_AUDIT
                         (ACCT_NUM, ACTION, ACTOR, TS)
                      VALUES (:ACCT-NUMBER, 'CREATE',
                              :COMM-FUNCTION, CURRENT_TIMESTAMP)
    tables:
      - acct_audit
    calledBy:
      - cobolPrograms.ACCTMGR
  - name: ACCTMGR:UPDATE:customer
    frequency: medium
    query: |-
      UPDATE CUSTOMER
                         SET ACTIVE_ACCT_COUNT = ACTIVE_ACCT_COUNT - 1
                       WHERE CUST_ID = :ACCT-CUSTOMER-ID
    tables:
      - customer
    calledBy:
      - cobolPrograms.ACCTMGR
  - name: BCHEOD:INSERT:eod_runs
    frequency: medium
    query: |-
      INSERT INTO EOD_RUNS (STARTED_AT, STATUS)
                   VALUES (CURRENT_TIMESTAMP, 'RUN')
    tables:
      - eod_runs
    calledBy:
      - cobolPrograms.BCHEOD
  - name: BCHEOD:UPDATE:eod_runs
    frequency: medium
    query: "UPDATE EOD_RUNS

      \                SET ENDED_AT = CURRENT_TIMESTAMP,

      \                    STATUS   = :WS-STATUS-CODE

      \              WHERE STARTED_AT = (SELECT MAX(STARTED_AT)

      \                              "
    tables:
      - eod_runs
    calledBy:
      - cobolPrograms.BCHEOD
  - name: FRDCHK:SELECT:txn_ledger
    frequency: medium
    query: |-
      SELECT COUNT(*), COALESCE(SUM(AMOUNT),0)
                INTO :WS-VELOCITY-COUNT, :WS-VELOCITY-AMT
                FROM TXN_LEDGER
               WHERE ACCT = :TXN-ACCT-NUMBER
                 AND POSTED_AT >= CURRENT_TIMEST
    tables:
      - txn_ledger
    calledBy:
      - cobolPrograms.FRDCHK
  - name: FRDCHK:INSERT:fraud_flags
    frequency: medium
    query: |-
      INSERT INTO FRAUD_FLAGS
                      (ACCT, SCORE, REASON, TS)
                   VALUES (:TXN-ACCT-NUMBER,
                           :WS-RISK-SCORE,
                           'AUTO-FREEZE',
                           C
    tables:
      - fraud_flags
    calledBy:
      - cobolPrograms.FRDCHK
  - name: KYCSYNC:MERGE:kyc_audit
