    query: |-
      DECLARE STMT-CSR CURSOR WITH HOLD FOR
              SELECT ACCT, AMOUNT, BALANCE_AFTER, DESCRIPTION
                FROM TXN_LEDGER
               WHERE ACCT = :WS-CURRENT-ACCT
                 AND POSTED_AT >= CURRENT_DATE 
    tables:
      - txn_ledger
    calledBy:
      - cobolPrograms.STMTRPT
  - name: TXNPOST:INSERT:txn_ledger
